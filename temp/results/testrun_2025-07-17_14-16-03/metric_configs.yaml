          multiple: true
          required: true
    example: resources_test/task_denoising/cxg_immune_cell_atlas/score.h5ad
    must_exist: true
    create_parent: true
    required: true
    direction: output
    multiple: false
    multiple_sep: ;
    plainName: output
    default: *id002
