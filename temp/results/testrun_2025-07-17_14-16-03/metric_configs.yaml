          description: denoised data
          required: true
        uns:
        - type: string
          name: dataset_id
          description: A unique identifier for the dataset
          required: true
        - type: string
          name: method_id
          description: A unique identifier for the method
          required: true
    example: resources_test/task_denoising/cxg_immune_cell_atlas/denoised.h5ad
    must_exist: true
    create_parent: true
    required: true
    direction: input
    multiple: false
    multiple_sep: ;
    plainName: input_prediction
  - type: file
