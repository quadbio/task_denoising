- dataset_description: To better understand pancreatic β-cell heterogeneity we generated
    a mouse pancreatic islet atlas capturing a wide range of biological conditions.
    The atlas contains scRNA-seq datasets of over 300,000 mouse pancreatic islet cells,
    of which more than 100,000 are β-cells, from nine datasets with 56 samples, including
    two previously unpublished datasets. The samples vary in sex, age (ranging from
    embryonic to aged), chemical stress, and disease status (including T1D NOD model
    development and two T2D models, mSTZ and db/db) together with different diabetes
    treatments. Additional information about data fields is available in anndata uns
    field 'field_descriptions' and on https://github.com/theislab/mm_pancreas_atlas_rep/blob/main/resources/cellxgene.md.
  dataset_id: cxg_mouse_pancreas_atlas_subsample
