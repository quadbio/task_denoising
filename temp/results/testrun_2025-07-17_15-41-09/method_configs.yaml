    path: /resources_test/task_denoising/cxg_immune_cell_atlas
    dest: resources_test/task_denoising/cxg_immune_cell_atlas
  info:
    v1:
      path: openproblems/tasks/denoising/methods/magic.py
      commit: b3456fd73c04c28516f6df34c57e6e3e8b0dab32
    variants:
      magic_approx:
        solver: approximate
      magic_knn_naive:
        norm: log
        decay: none
        t: 1
    preferred_normalization: counts
    type: method
    type_info:
      label: Method
      summary: A method.
      description: |
        A denoising method to remove noise (i.e. technical artifacts) from a dataset.
